<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#3d1a78"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Board square -->
  <rect x="96" y="96" width="320" height="320" rx="20" fill="url(#green)" stroke="#1B5E20" stroke-width="6"/>
  <!-- Inner board -->
  <rect x="140" y="140" width="232" height="232" rx="10" fill="#81C784" opacity="0.5"/>
  <!-- Dice 1 -->
  <rect x="170" y="200" width="70" height="70" rx="12" fill="white" stroke="#ddd" stroke-width="2"/>
  <circle cx="195" cy="215" r="6" fill="#333"/>
  <circle cx="220" cy="215" r="6" fill="#333"/>
  <circle cx="195" cy="255" r="6" fill="#333"/>
  <circle cx="220" cy="255" r="6" fill="#333"/>
  <circle cx="207" cy="235" r="6" fill="#333"/>
  <!-- Dice 2 -->
  <rect x="270" y="200" width="70" height="70" rx="12" fill="white" stroke="#ddd" stroke-width="2"/>
  <circle cx="295" cy="215" r="6" fill="#333"/>
  <circle cx="320" cy="215" r="6" fill="#333"/>
  <circle cx="295" cy="255" r="6" fill="#333"/>
  <circle cx="320" cy="255" r="6" fill="#333"/>
  <!-- Text: BT -->
  <text x="256" y="170" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="url(#gold)">BT</text>
  <!-- Bottom text -->
  <text x="256" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFD700" letter-spacing="6">BHARAT</text>
  <text x="256" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#FF8C00" letter-spacing="8">TYCOON</text>
  <!-- Corner houses -->
  <rect x="105" y="105" width="40" height="25" rx="4" fill="#FF6B6B"/>
  <rect x="365" y="105" width="40" height="25" rx="4" fill="#4FC3F7"/>
  <rect x="105" y="380" width="40" height="25" rx="4" fill="#FFD700"/>
  <rect x="365" y="380" width="40" height="25" rx="4" fill="#66BB6A"/>
</svg>
